</button>

</div>

</div>
</div>
<script>
const STEP_HTML = "<div style=\"height: 52px; padding: 0 18px 0 6px; border-radius: 26px; background: #0B2545; color: #FFFFFF; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 16px rgba(11,37,69,.22); animation: pop 0.78s ease both;\">\n<span class=\"disp\" style=\"width: 40px; height: 40px; border-radius: 20px; background: #5DB645; color: #0B2545; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;\">{{st.n}}</span>\n<span style=\"font-size: 15px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;\">Part {{st.n}} of 8</span>\n</div>";
const SUB_OPEN = "<div style=\"position: absolute; left: 48px; right: 48px; top: 0; height: 70px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 22px; line-height: 1.3; font-weight: 700; color: #F4F7FB; animation: up 0.7s ease both;\">";
function fit(){ const s = Math.min(window.innerWidth / 1280, window.innerHeight / 870); document.getElementById('fit').style.transform = 'scale(' + s + ')'; }
window.addEventListener('resize', fit); fit();
class Player {
  constructor() {
    this.state = { scene: 0, el: 0, playing: false, started: false, ended: false, music: true, subsOn: true };
    this.ctx = null;
  }
  durs() { return [25000, 98000, 72000, 88000, 33000, 86000, 71000, 80000, 37000]; }
  subLines() {
    return [[[0, "Welcome! This video covers the billing guidelines for your support time."], [4000, "Every case takes time. Some of that time is billable to the customer, and some of it is not."], [9000, "You'll see the billable work first, then the work you should not bill, and then the customer exceptions."], [15000, "After that: how to enter your time in Salesforce, a practice round, how to correct entries, and a recap."]],
      [[0, "Part 1: add your billable time for these six kinds of support work."], [4000, "One: reproducing a new issue that involves flows, logins and so on, when it takes five minutes or more."], [8500, "This covers Functionality, Misalignment and Translation issues."], [19000, "Two: time liaising with other departments to clarify or troubleshoot an issue."], [23500, "Working through the issue with another team? Add that time."], [34000, "Three: time spent on customer communication."], [38500, "That means phone calls, scheduled phone calls, and email and Cases communication."], [49000, "Four: regression testing issues that other teams have returned."], [53500, "When a fix comes back to you, the time you spend re-testing it is billable."], [64000, "Five: API Support."], [68500, "Time spent helping the customer with the API is billable."], [79000, "Six: educational calls about SSL and certificates."], [83500, "Note: the educational call is billable. Handling an SSL or Cert case is not."], [94000, "Those are the six billable types. Add that time to the case."]],
      [[0, "Part 2: do not add billable time for this work. Pay close attention to these."], [4000, "One: a standard pass-through of a case to another department, when the issue is simple and clear."], [10200, "For example: a customer reports a broken link and sends the URL and a screenshot. You confirm it and pass it to PE. No billable time."], [20000, "Two: standard case updates, like a follow-up or the extension of a deadline."], [26200, "For example: you tell the customer PE is still working on it, and you move the deadline. No billable time."], [36000, "Three: any case where the account has a warning: Do not bill without customer's approval."], [42200, "For example: a 30-minute call is usually billable. On this account, without the customer's approval, don't add it."], [52000, "Four: MotionPoint translation mistakes, such as brand names or trademarks."], [58200, "For example: we translated the customer's brand name. The mistake is ours: fix it, but don't bill the time."], [68000, "Next: MotionPoint applications."]],
      [[0, "Part 3: more work you do not bill: Live Edit, Cases.Motionpoint.com, SSL and Cert case handling, Offline cases, and UAT cases."], [4000, "One: Live Edit. That includes creating Live Edit users, and supporting customers in Live Edit."], [10200, "For example: a customer asks for a Live Edit login for a new editor, then needs help using it. No billable time."], [20000, "Two: Cases.Motionpoint.com, and demos."], [26200, "For example: a customer can't find their cases in the portal and asks for a demo. No billable time."], [36000, "Three: SSL and Cert case handling."], [42200, "For example: you renew a customer's SSL certificate. Not billable. A separate call to teach how SSL works is billable."], [52000, "Four: offline cases."], [58200, "For example: an Offline case takes you 40 minutes. However long it takes, don't add billable time."], [68000, "Five: UAT cases. Cases with the orange UAT banner are never billable. UAT work is part of the project."], [74200, "For example: a UAT case says the Spanish checkout button does nothing. Complete the milestone, post the customer note, and assign it to the team in the MPD email. No billable time."], [84000, "None of these five get billable time."]],
      [[0, "Part 4: specific customer exceptions."], [3500, "Some customers have their own rule. For VS, email image cases are a specific exception."], [6500, "You can spot them by Email in the Business Entity, like this Victoria's Secret case."], [10000, "Don't add billable time to these cases, even if the work looks billable."], [16000, "For example: VS reports broken images in an email, and you spend 15 minutes reproducing it. Still no billable time."], [24000, "Always check for customer exceptions before you log your time."]],
      [[0, "Part 5: entering your time in Salesforce."], [4000, "On the case, click the Time Entry tab, next to Feed and Case History."], [17000, "Pick the Date, and the Priority."], [21500, "Important: use the same priority as the case. Critical, Express, or Standard."], [30000, "Enter your Hours. It's required. You can use hours and minutes, or a decimal."], [43000, "Choose the Utilization Category. As Support, it's Billable, or SU Non-Billable."], [56000, "For non-billable work, choose SU Non-Billable, then pick the Non-Billable Reason."], [60500, "Reasons include General Department Work, Internal Meeting, MP Caused Issue, and Training."], [69000, "For billable work, choose Billable, and add a quick comment, such as SU troubleshooting."], [75000, "Then click Save."], [82000, "That's how you log your time on a case."]],
      [[0, "Part 6: practice. Is this billable, or not?"], [4000, "A 45-minute call teaching the customer how SSL certificates work?"], [10400, "Billable. It's an SSL educational call."], [13000, "Handling a customer's SSL certificate case?"], [19400, "Not billable. Handling the SSL or Cert case itself is not billable."], [22000, "Passing a simple, clear bug to PE?"], [28400, "Not billable. It's a standard pass-through."], [31000, "Re-testing a fix that PE sent back to Support?"], [37400, "Billable. That's regression testing."], [40000, "Twenty minutes reproducing a broken login on the Spanish site?"], [46400, "Billable. It's a new issue with a login flow, and it took five minutes or more."], [49000, "Fixing a trademark that MotionPoint mistranslated?"], [55400, "Not billable. It's our own translation mistake."], [58000, "Troubleshooting for an account marked WARNING: Do not bill without customer's approval?"], [64400, "Not billable. The warning means no billable time."], [67000, "Nice work!"]],
      [[0, "Part 7: correcting billing entries."], [3000, "Say you logged 15 minutes for a follow-up email. That's a standard update, so it's not billable."], [8500, "Good news: you can always correct billing entries on a case, as long as the billing cycle hasn't closed."], [16000, "Once the billing cycle closes, it's too late to correct the entry."], [22000, "That's why it's so important to recognize the not-billable situations."], [27500, "Log it right the first time, and fix any mistakes before the cycle closes."], [37000, "Here's how to correct an entry in Salesforce. In Time Entry, open Recent Entries."], [41500, "In the Work list, find the wrong entry, and open the arrow menu at the end of its row."], [50000, "Click Edit."], [63000, "Change the Utilization Category from Billable to SU Non-Billable."], [67700, "Pick the Non-Billable Reason, and save. Billable Hours is recalculated when you save."], [74000, "Done: the entry is now non-billable."]],
      [[0, "Recap."], [2500, "Billable: reproducing new issues, liaising with other teams, customer communication, regression testing, API Support, and SSL educational calls."], [11500, "Not billable: simple pass-throughs, standard updates, accounts with a WARNING, our own translation mistakes, Live Edit, Cases.Motionpoint.com, SSL and Cert case handling, Offline cases, and UAT cases."], [21500, "Remember the customer exceptions, like VS email image cases."], [24000, "And if an entry is wrong, correct it before the billing cycle closes."], [27000, "In Salesforce: match the case priority. Billable gets a quick comment. SU Non-Billable gets a reason."], [33000, "Thanks for watching!"]]];
  }
  labels() { return ["Intro", "Billable", "Not billable", "Not billable 2", "Exceptions", "Enter time", "Practice", "Corrections", "Recap"]; }

  /* ---------- original background jazz, synthesized live ---------- */
  bars() {
    // [bass walk (MIDI), chord voicing (MIDI)] — ii-V-I in F with turnarounds, 80 bpm swing
    return [
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[41, 45, 48, 49], [57, 60, 64, 67]], // Fmaj9
      [[50, 48, 45, 44], [54, 60, 64, 69]], // D9
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[45, 48, 52, 51], [60, 64, 67, 71]], // Am9
      [[50, 48, 45, 44], [54, 60, 64, 69]]  // D9
    ];
  }
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  initAudio() {
    if (this.ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 1.0);
      const noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      this.ctx = ctx; this.master = master; this.noise = noise;
      this.beat = 0; this.nextT = 0;
      return true;
    } catch (e) { return false; }
  }
  pianoNote(m, t, vel, dur) {
    const c = this.ctx;
    const f = this.hz(m);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(900, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.006);
    g.gain.exponentialRampToValueAtTime(vel * 0.3, t + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g); g.connect(this.master);
    [[1, 1], [2, 0.28], [3, 0.08]].forEach((h) => {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * h[0];
      const hg = c.createGain(); hg.gain.value = h[1];
      o.connect(hg); hg.connect(lp);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }
  pianoChord(notes, t, vel, dur) {
    notes.forEach((m, i) => this.pianoNote(m, t + i * 0.018, vel, dur));
  }
  tap(t, vol, dur, freq) {
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  scheduleBeat(i, t) {
    const spb = 60 / 80;
    const sw = spb * 2 / 3;
    const barIx = Math.floor(i / 4) % 8;
    const bar = this.bars()[barIx];
    const b = i % 4;
    this.tap(t, 0.014, 0.25, 7500);
    if (b === 1 || b === 3) {
      this.tap(t + sw, 0.01, 0.18, 7500);
      this.tap(t, 0.012, 0.05, 9500);
    }
    if (b === 0) {
      this.pianoNote(bar[0][0] + 12, t, 0.05, 2.4);
      this.pianoChord(bar[1], t + 0.03, 0.028, 2.2);
    }
    const v = Math.floor(i / 4) % 2;
    if (b === 2 && v === 0) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
    if (b === 1 && v === 1) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
  }
  schedule() {
    const c = this.ctx;
    if (!c || c.state !== 'running' || !this.musicLive) return;
    if (this.nextT < c.currentTime) this.nextT = c.currentTime + 0.05;
    while (this.nextT < c.currentTime + 0.3) {
      this.scheduleBeat(this.beat, this.nextT);
      this.beat = (this.beat + 1) % 32;
      this.nextT += 60 / 80;
    }
  }
  musicStart() {
    if (!this.state.music || !this.initAudio()) return;
    const c = this.ctx;
    try { c.resume(); } catch (e) {}
    if (!this.musicLive) {
      this.musicLive = true;
      this.beat = 0;
      this.nextT = c.currentTime + 0.1;
      this.master.gain.cancelScheduledValues(c.currentTime);
      this.master.gain.setValueAtTime(0.0001, c.currentTime);
      this.master.gain.exponentialRampToValueAtTime(0.55, c.currentTime + 1.5);
    }
  }
  musicStop(fade) {
    if (!this.ctx) return;
    const c = this.ctx;
    this.musicLive = false;
    const now = c.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setValueAtTime(Math.max(this.master.gain.value, 0.0001), now);
    this.master.gain.exponentialRampToValueAtTime(0.0001, now + (fade || 0.3));
  }
  musicPause() { if (this.ctx) { try { this.ctx.suspend(); } catch (e) {} } }
  musicResume() { if (this.ctx && this.state.music) { try { this.ctx.resume(); } catch (e) {} } }

  componentDidMount() {
    this.iv = setInterval(() => this.tick(), 200);
    this.au = setInterval(() => this.schedule(), 60);
  }
  componentWillUnmount() {
    clearInterval(this.iv); clearInterval(this.au); clearTimeout(this.to);
    if (this.ctx) { try { this.ctx.close(); } catch (e) {} }
  }
  tick() {
    const s = this.state;
    if (!s.playing || s.scene < 0) return;
    const d = this.durs();
    const el = s.el + 200;
    if (el >= d[s.scene]) {
      if (s.scene < d.length - 1) this.setState({ scene: s.scene + 1, el: 0 });
      else { this.setState({ el: d[s.scene], playing: false, ended: true }); this.musicStop(3); }
    } else {
      this.setState({ el: el });
    }
  }
  go(i) {
    clearTimeout(this.to);
    this.musicStart();
    this.musicResume();
    this.setState({ scene: -1, el: 0 });
    this.to = setTimeout(() => this.setState({ scene: i, el: 0, started: true, playing: true, ended: false }), 40);
  }
  fmt(ms) {
    const t = Math.floor(ms / 1000);
    const m = Math.floor(t / 60);
    const sec = t % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  renderVals() {
    const s = this.state;
    const d = this.durs();
    const total = d.reduce((a, b) => a + b, 0);
    const cur = s.scene < 0 ? 0 : s.scene;
    let done = 0;
    for (let i = 0; i < cur; i++) done += d[i];
    done += s.scene < 0 ? 0 : s.el;
    const vis = s.started ? s.scene : -2;
    const chapters = this.labels().map((label, i) => ({
      label: label,
      cls: s.started && i === cur ? 'on' : (s.started && i < cur ? 'done' : ''),
      go: () => this.go(i)
    }));
    return {
      s0: vis === 0, s1: vis === 1, s2: vis === 2, s3: vis === 3, s4: vis === 4, s5: vis === 5, s6: vis === 6, s7: vis === 7, s8: vis === 8,
      showCover: !s.started,
      pauseCls: s.playing ? '' : 'paused',
      isPlaying: s.playing,
      notPlaying: !s.playing,
      playLabel: s.playing ? 'Pause' : (s.ended ? 'Replay' : 'Play'),
      progressW: (Math.min(1, done / total) * 100).toFixed(2) + '%',
      timeLabel: this.fmt(done) + ' / ' + this.fmt(total),
      chapters: chapters,
      steps: [1, 2, 3, 4, 5, 6, 7, 8].map((n) => ({ n: n, on: s.started && s.scene >= 0 && s.scene === n })),
      showSubs: s.subsOn && s.started,
      subs: (() => {
        const L = s.scene >= 0 ? this.subLines()[s.scene] : [];
        let act = -1;
        L.forEach((c, i) => { if (s.el >= c[0]) act = i; });
        return L.map((c, i) => ({ text: c[1], on: i === act }));
      })(),
      subsOn: s.subsOn,
      subsLabel: s.subsOn ? 'Hide captions' : 'Show captions',
      subsColor: s.subsOn ? '#8FD16F' : '#A9B8CC',
      toggleSubs: () => this.setState({ subsOn: !this.state.subsOn }),
      musicOn: s.music,
      musicOff: !s.music,
      musicLabel: s.music ? 'Music on' : 'Music off',
      toggleMusic: () => {
        const on = !this.state.music;
        this.setState({ music: on }, () => {
          if (!on) this.musicStop(0.6);
          else if (this.state.playing) this.musicStart();
        });
      },
      togglePlay: () => {
        if (!this.state.started || this.state.ended) this.go(0);
        else {
          const playing = !this.state.playing;
          if (playing) this.musicResume(); else this.musicPause();
          this.setState({ playing: playing });
        }
      },
      replay: () => this.go(0),
      prev: () => this.go(Math.max(0, cur - 1)),
      next: () => this.go(Math.min(d.length - 1, cur + 1))
    };
  }
}

Player.prototype.setState = function (obj, cb) { Object.assign(this.state, obj); this.render(); if (cb) cb(); };
Player.prototype.render = function () {
  const v = this.renderVals();
  const $ = (id) => document.getElementById(id);
  const s = this.state;
  const vis = s.started ? s.scene : -2;
  if (vis !== this._vis) {
    this._vis = vis;
    const tpl = $('scene-' + vis);
    $('sceneHost').innerHTML = tpl ? tpl.innerHTML : '';
  }
  $('stage').classList.toggle('paused', !s.playing);
  $('cover').hidden = !v.showCover;
  const st = v.steps.find((x) => x.on);
  const stn = st ? st.n : 0;
  if (stn !== this._step) { this._step = stn; $('steps').innerHTML = stn ? STEP_HTML.split('{{st.n}}').join(String(stn)) : ''; }
  const sb = v.showSubs ? v.subs.find((x) => x.on) : null;
  const key = sb ? s.scene + '|' + sb.text : '';
  if (key !== this._sub) {
    this._sub = key;
    $('subs').innerHTML = '';
    if (sb) { const d = document.createElement('div'); d.innerHTML = SUB_OPEN + '</div>'; d.firstChild.textContent = sb.text; $('subs').appendChild(d.firstChild); }
  }
  $('prog').style.width = v.progressW;
  $('timeLabel').textContent = v.timeLabel;
  $('playLabel').textContent = v.playLabel;
  $('playBtn').setAttribute('aria-label', v.playLabel);
  $('icoPause').hidden = !v.isPlaying; $('icoPlay').hidden = v.isPlaying;
  $('musicLabel').textContent = v.musicLabel; $('musicBtn').setAttribute('aria-label', v.musicLabel); $('musicBtn').setAttribute('aria-pressed', String(v.musicOn));
  $('icoMusicOn').hidden = !v.musicOn; $('icoMusicOff').hidden = v.musicOn;
  $('subsBtn').setAttribute('aria-label', v.subsLabel); $('subsBtn').setAttribute('aria-pressed', String(v.subsOn)); $('subsIcon').setAttribute('stroke', v.subsColor);
  const ck = v.chapters.map((c) => c.cls).join(',');
  if (ck !== this._chips) {
    this._chips = ck;
    const host = $('chapters'); host.innerHTML = '';
    v.chapters.forEach((c, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip ' + c.cls; b.textContent = c.label;
      b.addEventListener('click', () => this.go(i)); host.appendChild(b);
    });
  }
};
const P = new Player();
const call = (k) => () => P.renderVals()[k]();
document.getElementById('coverPlay').addEventListener('click', call('togglePlay'));
document.getElementById('playBtn').addEventListener('click', call('togglePlay'));
document.getElementById('replayBtn').addEventListener('click', call('replay'));
document.getElementById('prevBtn').addEventListener('click', call('prev'));
document.getElementById('nextBtn').addEventListener('click', call('next'));
document.getElementById('musicBtn').addEventListener('click', call('toggleMusic'));
document.getElementById('subsBtn').addEventListener('click', call('toggleSubs'));
P.render();
P.componentDidMount();

</script>
